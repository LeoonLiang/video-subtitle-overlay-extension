name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and package release asset
        env:
          EXTENSION_VERSION: ${{ github.ref_name }}
        run: npm run package:release

      - name: Generate release notes
        env:
          EXTENSION_VERSION: ${{ github.ref_name }}
        run: npm run release:notes

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/video-subtitle-overlay-extension.zip
          body_path: dist/release/release-notes.md
